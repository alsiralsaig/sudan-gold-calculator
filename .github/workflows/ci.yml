name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: الاختبارات
        run: npm test
        env:
          AUTH_SECRET: ci-test-secret-with-enough-length

      - name: بناء المشروع
        run: npm run build
        env:
          AUTH_SECRET: ci-test-secret-with-enough-length
